name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners already ship with the Android SDK,
      # so no setup-android step is needed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "No gradlew wrapper found - using installed Gradle"
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasks-Tracker-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
