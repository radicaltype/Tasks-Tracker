name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Figure out which framework this is and which Java version it needs
      - name: Detect project type
        id: detect
        run: |
          JAVA=17
          if ls capacitor.config.* >/dev/null 2>&1; then
            echo "type=capacitor" >> $GITHUB_OUTPUT
            CAP_MAJOR=$(node -p "((require('./package.json').dependencies||{})['@capacitor/android']||'0').replace(/[^0-9.]/g,'').split('.')[0]||0")
            if [ "$CAP_MAJOR" -ge 7 ]; then JAVA=21; fi
            echo "Detected Capacitor (v$CAP_MAJOR)"
          else
            echo "type=other" >> $GITHUB_OUTPUT
            echo "Detected React Native / other JS project"
          fi
          echo "java=$JAVA" >> $GITHUB_OUTPUT
          echo "Using Java $JAVA"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.detect.outputs.java }}

      - name: Install JavaScript dependencies
        run: |
          if [ -f yarn.lock ]; then
            corepack enable && yarn install
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Capacitor apps: build the web app, then copy it into the android folder
      - name: Build web assets and sync (Capacitor only)
        if: steps.detect.outputs.type == 'capacitor'
        run: |
          npm run build --if-present
          npx cap sync android

      # GitHub's Ubuntu runners already ship with the Android SDK
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Restore the permanent signing key so the SHA-1 registered in Firebase stays valid
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/tasktracker.keystore
            echo "Signing key restored"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - APK will use a throwaway debug key and Google sign-in will fail"
          fi
          if [ ! -f android/app/google-services.json ]; then
            echo "::warning::android/app/google-services.json missing - Firebase native sign-in will not work"
          fi

      - name: Build debug APK
        working-directory: android   # the Gradle project lives in this subfolder
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "No gradlew wrapper found - using installed Gradle"
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasks-Tracker-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
