# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are overridden by the Gradle
# settings configured at the command line when running Gradle tasks (e.g. this
# script, the gradle-wrapper.jar). They would normally be overridden by values
# specified in local.properties, but it is possible for a Gradle build to fail
# if there are values specified here that conflict with values specified in
# local.properties.
#
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
org.gradle.parallel=true
